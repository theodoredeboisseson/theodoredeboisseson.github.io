<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark squircle background -->
  <rect width="100" height="100" rx="28" fill="#111111" />
  <!-- Italic serif T shifted left to give room for dot -->
  <text x="20" y="70"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="700"
        font-size="64"
        fill="white">T</text>
  <!-- Red dot accent, clearly to the right of the T crossbar -->
  <circle cx="70" cy="65" r="7" fill="#d94261" />
</svg>
